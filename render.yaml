# Render Blueprint — Conecta 4
# Servicios separados para frontend (Static Site) y backend (Web Service).
#
# ⚠️  Notas:
#   1. Frontend: la WS_URL se define en frontend/src/environments/.
#      environment.ts -> dev (localhost)
#      environment.prod.ts -> produccion (se reemplaza via fileReplacements en el build)
#      Si cambia la URL del backend, actualizar environment.prod.ts y redeployar.
#   2. Backend: CORS actualmente acepta solo localhost.
#      Se inyecta CORS_ORIGINS via env var; si no se define,
#      usa los valores por defecto (localhost).

services:
  # ── Backend: FastAPI + WebSockets ────────────────────────────
  - type: web
    name: connect4-backend
    env: python
    region: ohio
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.0
      - key: CORS_ORIGINS
        value: https://connect4-frontend-e17h.onrender.com
        comment: >
          Lista separada por comas de orígenes permitidos para CORS.
          Debe incluir la URL del frontend en producción.
      - key: DEBUG
        value: "false"

  # ── Frontend: Angular SPA (Static Site) ──────────────────────
  - type: web
    name: connect4-frontend
    env: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist/frontend/browser
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: WS_URL
        value: wss://connect4-backend-3dks.onrender.com/ws/pvp
        comment: >
          URL del WebSocket del backend en producción.
          Actualmente está hardcodeada en frontend/src/environments/environment.prod.ts.
          Si cambia, actualizar ese archivo y redeployar.

<section class="lobby" aria-label="Lobby">
  <h1>Conecta 4</h1>

  @if (status() === 'connecting') {
    <div class="mode-selector">
      <label class="mode-label">Modo de juego</label>
      <div class="toggle-group" role="radiogroup" aria-label="Modo de juego">
        <button
          class="toggle-btn"
          [class.active]="selectedMode() === 'pvp'"
          (click)="onModeChange('pvp')"
          role="radio"
          [attr.aria-checked]="selectedMode() === 'pvp'"
        >
          1 VS 1
        </button>
        <button
          class="toggle-btn"
          [class.active]="selectedMode() === 'pve'"
          (click)="onModeChange('pve')"
          role="radio"
          [attr.aria-checked]="selectedMode() === 'pve'"
        >
          1 VS IA
        </button>
      </div>
    </div>

    @if (selectedMode() === 'pve') {
      <div class="difficulty-selector">
        <label class="mode-label">Dificultad</label>
        <div class="toggle-group" role="radiogroup" aria-label="Dificultad">
          <button
            class="toggle-btn"
            [class.active]="selectedDifficulty() === 'easy'"
            (click)="onDifficultyChange('easy')"
            role="radio"
            [attr.aria-checked]="selectedDifficulty() === 'easy'"
          >
            Fácil
          </button>
          <button
            class="toggle-btn"
            [class.active]="selectedDifficulty() === 'medium'"
            (click)="onDifficultyChange('medium')"
            role="radio"
            [attr.aria-checked]="selectedDifficulty() === 'medium'"
          >
            Medio
          </button>
          <button
            class="toggle-btn"
            [class.active]="selectedDifficulty() === 'hard'"
            (click)="onDifficultyChange('hard')"
            role="radio"
            [attr.aria-checked]="selectedDifficulty() === 'hard'"
          >
            Difícil
          </button>
        </div>
      </div>
    }

    <button class="start-btn" (click)="onStart()">
      {{ selectedMode() === 'pvp' ? 'Buscar partida' : 'Jugar contra IA' }}
    </button>
  }

  <div class="status-bar" aria-label="Estado de la conexión" aria-live="polite">
    @if (status() === 'waiting') {
      <p class="searching">Buscando rival...</p>
      <button class="back-btn" (click)="onBack()">Volver</button>
    }
  </div>

  @if (status() !== 'waiting') {
    @if (clientId(); as id) {
      <p class="info-line">
        <span class="label">client_id:</span>
        <code>{{ id }}</code>
      </p>
    }

    @if (sessionId(); as id) {
      <p class="info-line">
        <span class="label">session_id:</span>
        <code>{{ id }}</code>
      </p>
    }
  }
</section>

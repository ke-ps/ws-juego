<section class="board-container" aria-label="Tablero">
  <div class="turn-indicator">
    @if (disabled()) {
      <span class="turn-text opponent">Turno del oponente</span>
    } @else {
      <span class="turn-text mine">Tu turno</span>
    }
  </div>

  <div class="grid" role="grid" [class.disabled]="disabled()">
    @for (row of board(); track $index) {
      <div class="row" role="row">
        @for (cell of row; track $index) {
          <div class="cell" role="gridcell" (click)="selectColumn($index)">
            @if (cell === 'R') {
              <span class="piece red" aria-label="Ficha roja"></span>
            } @else if (cell === 'Y') {
              <span class="piece yellow" aria-label="Ficha amarilla"></span>
            } @else {
              <span class="piece empty" aria-label="Vacío"></span>
            }
          </div>
        }
      </div>
    }
  </div>
</section>

@if (status() === 'in_game') {
  <app-board [board]="board()" [disabled]="!isMyTurn()" [winner]="winner()" (columnSelected)="onColumnSelected($event)" (restart)="onRestart()" />
} @else {
  <app-lobby
    [status]="status()"
    [clientId]="clientId()"
    [sessionId]="sessionId()"
    [waitingMessage]="waitingMessage()"
  />
}

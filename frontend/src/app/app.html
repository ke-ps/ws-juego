@if (errorMessage(); as msg) {
  <div class="notification error" role="alert">
    <span>{{ msg }}</span>
    <button class="dismiss-btn" (click)="onDismissError()" aria-label="Cerrar">&times;</button>
  </div>
}

@if (opponentDisconnected()) {
  <div class="notification warning" role="alert">
    El oponente se ha desconectado
  </div>
}

@if (status() === 'in_game') {
  <app-board [board]="board()" [disabled]="!isMyTurn()" [winner]="winner()" (columnSelected)="onColumnSelected($event)" (restart)="onRestart()" />
} @else {
  <app-lobby
    [status]="status()"
    [clientId]="clientId()"
    [sessionId]="sessionId()"
    [waitingMessage]="waitingMessage()"
    (startGame)="onStartGame($event)"
    (back)="onBack()"
  />
}
